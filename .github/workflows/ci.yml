name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (all JS)
        run: |
          for f in js/*.js adminka6582/*.js sw.js tools/*.mjs tests/*.mjs; do
            echo "checking $f"; node --check "$f";
          done

      - name: i18n parity
        run: node tests/check-i18n.mjs

      - name: Install Playwright + browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Smoke tests
        env:
          CI: 'true'
        run: npx playwright test

      # RLS tests self-skip unless staging secrets are configured on the repo.
      - name: RLS policy tests (staging)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          RLS_A_EMAIL: ${{ secrets.RLS_A_EMAIL }}
          RLS_A_PASSWORD: ${{ secrets.RLS_A_PASSWORD }}
          RLS_B_EMAIL: ${{ secrets.RLS_B_EMAIL }}
          RLS_B_PASSWORD: ${{ secrets.RLS_B_PASSWORD }}
        run: node tests/rls.mjs
